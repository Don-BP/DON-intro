<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arcade Settings Popup</title>
<!-- Google Fonts: Plus Jakarta Sans for UI, Material Symbols for Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        /* Material Symbols Setup */
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Utility for Inner Gloss Highlights */
        .glossy-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
            border-radius: inherit;
            pointer-events: none;
        }

        /* Ribbon Fold Effect Masks */
        .ribbon-fold-left { clip-path: polygon(100% 0, 100% 100%, 0 0); }
        .ribbon-fold-right { clip-path: polygon(0 0, 0 100%, 100% 0); }
        
        /* Specific pattern override for standard Tailwind scrollbars to look clean */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #c0cab1; border-radius: 4px; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface-variant": "#414a36",
                        "tertiary-fixed": "#fed6ff",
                        "secondary-fixed-dim": "#a4c9ff",
                        "on-surface": "#181d12",
                        "surface": "#f6fce9",
                        "secondary-fixed": "#d4e3ff",
                        "surface-bright": "#f6fce9",
                        "tertiary-fixed-dim": "#f6adff",
                        "on-primary": "#ffffff",
                        "secondary-container": "#68abff",
                        "inverse-on-surface": "#edf3e0",
                        "primary-container": "#7ed321",
                        "surface-variant": "#dfe5d2",
                        "secondary": "#0060ac",
                        "on-error-container": "#93000a",
                        "outline": "#717a64",
                        "outline-variant": "#c0cab1",
                        "primary": "#3a6a00",
                        "on-secondary-container": "#003e73",
                        "on-secondary-fixed-variant": "#004883",
                        "on-primary-container": "#2e5600",
                        "on-background": "#181d12",
                        "inverse-surface": "#2d3226",
                        "primary-fixed": "#a1fa49",
                        "tertiary": "#a000bf",
                        "on-tertiary-container": "#83009d",
                        "on-primary-fixed-variant": "#2a5000",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#dfe5d2",
                        "primary-fixed-dim": "#87dc2c",
                        "on-secondary-fixed": "#001c39",
                        "surface-tint": "#3a6a00",
                        "on-tertiary-fixed": "#350040",
                        "on-tertiary-fixed-variant": "#7a0092",
                        "surface-container-high": "#e5ebd8",
                        "background": "#f6fce9",
                        "surface-container-low": "#f0f6e3",
                        "on-primary-fixed": "#0e2000",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#ebf0dd",
                        "error": "#ba1a1a",
                        "inverse-primary": "#87dc2c",
                        "on-error": "#ffffff",
                        "tertiary-container": "#f39fff",
                        "surface-dim": "#d7dcca"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "border-depth-md": "8px",
                        "unit": "8px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "border-depth-sm": "4px"
                    },
                    fontFamily: {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "display-md": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "headline-lg": ["28px", { lineHeight: "1.3", fontWeight: "700" }],
                        "label-bold": ["14px", { lineHeight: "1", fontWeight: "800" }],
                        "body-lg": ["18px", { lineHeight: "1.5", fontWeight: "600" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "1.3", fontWeight: "700" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "display-md": ["36px", { lineHeight: "1.2", fontWeight: "800" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased overflow-hidden font-body-lg text-on-surface">
<!-- Background Game Canvas (Behind Modal) -->
<div class="fixed inset-0 z-0 bg-secondary-fixed-dim" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCf9o-zAs5wBhfLx1hAuc1jXueWri2FSNgfYjqdDmcOcfQDJVeAClR4P8LitqrDWukqaGxelpa8H2R0T_0HILKtTlfs1LOku7ijm0RGyM7cmfCFmPQPxYYH-q9PuzokuhtwQH1VXnRpXO0kJcbJKB92LTKuRQ-X4jz5c8POs_Vw9BZMwOYolpqTeF9M950m6pTSwTSqqCFGafwYVrCckar-x2uVMlLlZrNmyTWyU2W5reS6IaPFQZ6ibRXaJOYFTG6rUVtere8Fflj9'); background-size: cover; background-position: center;">
<!-- Overlay to slightly dim background to make modal pop -->
<div class="absolute inset-0 bg-on-secondary-fixed/20 backdrop-blur-sm"></div>
</div>
<!-- Main Content Area: Centered Modal -->
<main class="relative z-10 w-full h-screen flex flex-col items-center justify-center p-4">
<!-- Settings Modal Container -->
<!-- Floating ambient drop shadow, solid white inner card base, thick depth border -->
<div class="relative w-full max-w-[420px] bg-secondary-fixed rounded-[32px] border-4 border-surface-container-lowest border-b-[12px] border-b-secondary shadow-[0_15px_40px_-5px_rgba(0,30,80,0.5)] mt-12 transition-transform duration-300">
<!-- Ribbon Header -->
<div class="absolute -top-10 left-0 right-0 flex justify-center z-20">
<div class="relative w-[110%] max-w-[460px] flex justify-center items-center">
<!-- Left Fold Background -->
<div class="absolute -bottom-3 left-4 w-6 h-6 bg-on-tertiary-fixed-variant ribbon-fold-left -z-10"></div>
<!-- Main Ribbon Banner -->
<div class="relative w-full bg-tertiary border-b-[6px] border-on-tertiary-fixed-variant rounded-xl py-3 px-6 shadow-lg flex justify-center items-center glossy-top transform -rotate-1 hover:rotate-0 transition-transform duration-300">
<!-- Inner highlight border line -->
<div class="absolute inset-0 border-t-2 border-white/30 rounded-xl pointer-events-none"></div>
<h1 class="font-display-md text-display-md text-on-tertiary drop-shadow-[0_3px_0_#7a0092] tracking-wide">
                            Settings
                        </h1>
</div>
<!-- Right Fold Background -->
<div class="absolute -bottom-3 right-4 w-6 h-6 bg-on-tertiary-fixed-variant ribbon-fold-right -z-10"></div>
</div>
</div>
<!-- Modal Content Padding (Accounting for Ribbon) -->
<div class="pt-16 pb-8 px-8 space-y-6 flex flex-col">
<!-- Music Row -->
<div class="flex items-center justify-between bg-surface-container-lowest/50 rounded-xl p-3 border-2 border-white/50 shadow-sm backdrop-blur-md">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-fixed">Music</span>
<!-- 'Juicy' Toggle: ON State -->
<button class="relative w-24 h-10 bg-secondary-fixed-dim rounded-full shadow-[inset_0_4px_8px_rgba(0,72,131,0.3)] flex items-center p-1 transition-all active:scale-95 group overflow-hidden border border-secondary-container/50">
<!-- Label Inside Track -->
<span class="absolute left-4 font-label-bold text-label-bold text-on-secondary-fixed-variant select-none">On</span>
<!-- Thumb -->
<div class="absolute right-1 w-8 h-8 bg-secondary border-b-[3px] border-on-secondary-fixed-variant rounded-full shadow-md glossy-top transition-all duration-300 group-hover:brightness-110"></div>
</button>
</div>
<!-- Sound Row -->
<div class="flex items-center justify-between bg-surface-container-lowest/50 rounded-xl p-3 border-2 border-white/50 shadow-sm backdrop-blur-md">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-fixed">Sound</span>
<!-- 'Juicy' Toggle: OFF State -->
<button class="relative w-24 h-10 bg-surface-container-highest rounded-full shadow-[inset_0_4px_8px_rgba(65,74,54,0.3)] flex items-center p-1 transition-all active:scale-95 group overflow-hidden border border-outline-variant/50">
<!-- Label Inside Track -->
<span class="absolute right-4 font-label-bold text-label-bold text-outline select-none">Off</span>
<!-- Thumb -->
<div class="absolute left-1 w-8 h-8 bg-surface border-b-[3px] border-outline-variant rounded-full shadow-md glossy-top transition-all duration-300 group-hover:brightness-110"></div>
</button>
</div>
<!-- Notifications Row -->
<div class="flex items-center justify-between bg-surface-container-lowest/50 rounded-xl p-3 border-2 border-white/50 shadow-sm backdrop-blur-md">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-fixed">Notifications</span>
<!-- Checkbox Style Button -->
<button class="relative w-10 h-10 bg-surface border-b-[4px] border-outline-variant rounded-lg flex items-center justify-center shadow-md active:border-b-0 active:translate-y-[4px] transition-all hover:scale-105 group glossy-top">
<span class="material-symbols-outlined text-primary font-bold drop-shadow-[0_1px_0_rgba(255,255,255,1)]" style="font-variation-settings: 'wght' 800;">check</span>
</button>
</div>
<!-- Divider -->
<div class="w-full h-[2px] bg-white/60 rounded-full my-2 shadow-[0_1px_0_rgba(0,0,0,0.05)]"></div>
<!-- Bottom Action Buttons (Green Check, Red X) -->
<div class="flex justify-center items-center gap-6 pt-2">
<!-- Green Confirm Button -->
<button class="relative w-20 h-16 bg-primary-container border-4 border-surface-container-lowest border-b-[8px] border-b-primary rounded-2xl flex items-center justify-center shadow-lg hover:scale-105 hover:brightness-110 active:border-b-[2px] active:translate-y-[6px] transition-all duration-150 glossy-top group group">
<span class="material-symbols-outlined text-on-primary-container drop-shadow-[0_2px_0_rgba(255,255,255,0.5)] transform group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1, 'wght' 700; font-size: 36px;">
                            check
                        </span>
</button>
<!-- Red Close/Cancel Button -->
<button class="relative w-20 h-16 bg-error-container border-4 border-surface-container-lowest border-b-[8px] border-b-error rounded-2xl flex items-center justify-center shadow-lg hover:scale-105 hover:brightness-110 active:border-b-[2px] active:translate-y-[6px] transition-all duration-150 glossy-top group">
<span class="material-symbols-outlined text-on-error-container drop-shadow-[0_2px_0_rgba(255,255,255,0.5)] transform group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1, 'wght' 700; font-size: 36px;">
                            close
                        </span>
</button>
</div>
</div>
</div>
</main>
</body></html>
