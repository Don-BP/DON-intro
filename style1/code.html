<style>
        /* Custom styles for the arcade aesthetic */
        body {
            background-color: #61B7F7; /* Using a vibrant blue background to match the prompt's image vibe */
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 100%);
        }

        .arcade-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 50, 100, 0.2), inset 0 -8px 0px rgba(220, 230, 240, 1);
            position: relative;
        }

        .arcade-ribbon {
            background: linear-gradient(180deg, #FFB300 0%, #FF8F00 100%);
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(255, 255, 255, 0.4), 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            margin-top: -20px;
        }

        .arcade-ribbon::before,
        .arcade-ribbon::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 30px;
            background: #FF6F00;
            z-index: -1;
            border-radius: 4px;
        }

        .arcade-ribbon::before {
            left: -10px;
            transform: translateY(-50%) skewY(15deg);
        }

        .arcade-ribbon::after {
            right: -10px;
            transform: translateY(-50%) skewY(-15deg);
        }

        .arcade-item {
            background: #FFF8E1; /* Light yellow tint */
            border-radius: 16px;
            box-shadow: inset 0 -4px 0px rgba(255, 224, 130, 1);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .arcade-item:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 -4px 0px rgba(255, 224, 130, 1), 0 6px 12px rgba(0,0,0,0.05);
        }

        .arcade-button-green {
            background: linear-gradient(180deg, #64DD17 0%, #33691E 100%);
            border-radius: 999px;
            box-shadow: inset 0 6px 8px rgba(255, 255, 255, 0.5), 0 4px 0px #1B5E20, 0 8px 12px rgba(0,0,0,0.2);
            border: 2px solid #F1F8E9;
            transition: all 0.1s ease;
        }

        .arcade-button-green:active {
            transform: translateY(4px);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3), 0 0px 0px #1B5E20, 0 2px 4px rgba(0,0,0,0.2);
        }

        .icon-box-energy { background: #FF80AB; border-radius: 12px 0 0 12px; }
        .icon-box-heart { background: #64B5F6; border-radius: 12px 0 0 12px; }
        .icon-box-coin { background: #B388FF; border-radius: 12px 0 0 12px; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
        }
    </style>
